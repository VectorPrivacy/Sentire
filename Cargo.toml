[package]
name = "sentinel"
version = "0.1.0"
edition = "2021"
description = "A moderation bot for Vector communities: the policy engine judges text, a vision model judges media, Sentinel decides the sentence."
license = "MIT"
rust-version = "1.82"  # Option::is_none_or

[dependencies]
vector_sdk = "0.10"
tokio = { version = "1.49", features = ["rt", "rt-multi-thread", "macros", "time", "signal", "sync", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }

# Build against the Vector working tree instead of crates.io. Required until
# vector-core 0.9.0 and vector_sdk 0.10.0 publish: everything Sentinel reads
# from a verdict (band, shield, findings) is unreleased.
#
# `nostr` is patched to match — the Vector workspace pins a fork whose SecretKey
# Drop zeroizes with volatile writes, and a path build without this line quietly
# links stock nostr instead.
[patch.crates-io]
vector_sdk = { path = "../Vector/crates/vector-sdk" }
vector-core = { path = "../Vector/crates/vector-core" }
nostr = { git = "https://github.com/VectorPrivacy/nostr.git", branch = "zeroize-secretkey-v0.45.1" }
